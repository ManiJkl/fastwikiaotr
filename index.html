<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AOTR Quick Wiki</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--card:#242832;--line:#333845;--tx:#e8eaf0;--mut:#9aa1b2;--acc:#e0b04a;--acc2:#5fb4d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:1200px;margin:0 auto}
.row+.row{margin-top:8px}
h1{font-size:17px;margin:0 12px 0 0;color:var(--acc)}
button,input,select,textarea{font:inherit;color:var(--tx)}
.tab,.chip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
.chip{padding:3px 10px;font-size:13px;color:var(--mut)}
.tab.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
.chip.on{background:var(--acc2);color:#10171b;border-color:var(--acc2)}
input[type=search]{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
main{max-width:1200px;margin:0 auto;padding:16px}
#count{color:var(--mut);font-size:13px;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card b{display:block;color:var(--acc);margin-bottom:3px}
.card p{margin:0;white-space:pre-wrap}
.meta{margin-top:6px;font-size:12px;color:var(--mut)}
.star{color:var(--acc)}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:8px}
details{max-width:1200px;margin:0 auto;padding:0 16px 40px}
summary{cursor:pointer;color:var(--acc2)}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
select,input.t{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px}
pre{background:var(--bg);border:1px solid var(--line);padding:8px;border-radius:6px;overflow:auto;font-size:12px}
.go{background:var(--acc);color:#1a1a1a;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600}
.warn{background:#3a2d12;border:1px solid #6b5420;color:#f0d9a0;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="row"><h1>AOTR Quick Wiki</h1><span id="tabs" class="row" style="margin:0"></span></div>
  <div class="row">
    <input id="q" type="search" placeholder="Buscar nombre o descripción...">
    <span id="stars" class="row" style="margin:0"></span>
  </div>
  <div class="row" id="groups"></div>
</header>
<main>
  <div id="note"></div>
  <div id="count"></div>
  <div id="grid"></div>
</main>

<details id="imp">
<summary>Importar datos de la wiki</summary>
<p><b>1)</b> Abre la página en la wiki (ej. <i>Memories</i>), pulsa F12 → Console, pega esto y Enter. Copia el resultado:</p>
<pre id="scr"></pre>
<p><b>2)</b> Elige la sección, pega el resultado aquí y pulsa Importar. (Acepta ese JSON, o líneas <code>Nombre | Descripción</code>.)</p>
<div class="row" style="margin:0 0 8px">
  <select id="isec"></select>
  <input class="t" id="igrp" placeholder="Grupo (opcional, p.ej. Support)">
  <select id="istar"><option value="0">Sin estrellas</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
</div>
<textarea id="itxt"></textarea>
<p><button class="go" id="ibtn">Importar</button> <button class="chip" id="iclr">Borrar importados</button> <span id="imsg" style="color:var(--mut)"></span></p>
</details>

<script src="data.js"></script>
<script>
(function(){
const SECS=["Memories","Perks","Families","Artifacts","Cosmetics"];
const KEY="aotr_imported_v1";
const $=id=>document.getElementById(id);
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const save=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
let sec=SECS[0],grp="",star=0,timer;
const all=()=>(window.AOTR_DATA||[]).concat(load());

function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(){
  const data=all().filter(x=>x.sec===sec);
  // groups
  const gs=[...new Set(data.map(x=>x.grp).filter(Boolean))];
  if(grp&&!gs.includes(grp))grp="";
  const gb=$("groups");gb.textContent="";
  if(gs.length){
    [""].concat(gs).forEach(g=>{const c=mk("button","chip"+(g===grp?" on":""),g||"Todos");c.onclick=()=>{grp=g;render()};gb.appendChild(c)});
  }
  // stars
  const hasStar=data.some(x=>x.star);
  const sb=$("stars");sb.textContent="";
  if(hasStar){
    for(let i=0;i<=5;i++){const c=mk("button","chip"+(i===star?" on":""),i?"★".repeat(i):"Todas");c.onclick=()=>{star=i;render()};sb.appendChild(c)}
  } else star=0;
  const q=$("q").value.trim().toLowerCase();
  const list=data.filter(x=>(!grp||x.grp===grp)&&(!star||x.star===star)&&(!q||(x.name+" "+x.desc).toLowerCase().includes(q)));
  $("count").textContent=list.length+" resultado"+(list.length===1?"":"s");
  const g=$("grid");g.textContent="";
  if(!list.length){g.appendChild(mk("div","empty",data.length?"Nada coincide con el filtro.":"Aún no hay datos en esta sección. Usa «Importar datos de la wiki» abajo."));return}
  const f=document.createDocumentFragment();
  list.forEach(x=>{
    const c=mk("div","card");
    c.appendChild(mk("b","",x.name));
    c.appendChild(mk("p","",x.desc));
    const m=[];if(x.grp)m.push(x.grp);
    const meta=mk("div","meta",m.join(" · "));
    if(x.star){const s=mk("span","star"," "+"★".repeat(x.star));meta.appendChild(s)}
    if(m.length||x.star)c.appendChild(meta);
    f.appendChild(c);
  });
  g.appendChild(f);
}

SECS.forEach(s=>{
  const b=mk("button","tab"+(s===sec?" on":""),s);b.dataset.s=s;
  b.onclick=()=>{sec=s;grp="";star=0;[...$("tabs").children].forEach(t=>t.classList.toggle("on",t.dataset.s===s));render()};
  $("tabs").appendChild(b);
  const o=mk("option","",s);$("isec").appendChild(o);
});
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(render,120)};

// scraper snippet shown to the user
$("scr").textContent=`(()=>{const out=[];let g="";
document.querySelectorAll("#mw-content-text h2,#mw-content-text h3,#mw-content-text h4,#mw-content-text tr").forEach(e=>{
 if(/^H/.test(e.tagName)){g=e.textContent.replace(/\\[.*?\\]/g,"").trim();return}
 const c=[...e.children].filter(x=>/^T[DH]$/.test(x.tagName)).map(x=>x.textContent.trim());
 if(e.querySelector("th")&&!e.querySelector("td"))return;
 if(c.length>=2&&c[0])out.push({grp:g,name:c[0],desc:c.slice(1).filter(Boolean).join(" — ")});
});copy(JSON.stringify(out));console.log(out.length+" filas copiadas")})()`;

$("ibtn").onclick=()=>{
  const t=$("itxt").value.trim(),s=$("isec").value,g0=$("igrp").value.trim(),st=+$("istar").value;
  let rows=[];
  try{rows=JSON.parse(t)}catch(e){
    rows=t.split(/\n/).map(l=>l.split(/\s*\|\s*|\t/)).filter(p=>p.length>=2&&p[0].trim()).map(p=>({name:p[0].trim(),desc:p.slice(1).join(" — ").trim()}));
  }
  if(!Array.isArray(rows))rows=[];
  const add=rows.filter(r=>r&&r.name).map(r=>({sec:s,grp:g0||r.grp||"",star:st||r.star||0,name:String(r.name),desc:String(r.desc||"")}));
  save(load().concat(add));
  $("imsg").textContent=add.length+" importados en "+s;$("itxt").value="";
  sec=s;[...$("tabs").children].forEach(t=>t.classList.toggle("on",t.dataset.s===s));render();
};
$("iclr").onclick=()=>{if(confirm("¿Borrar todo lo importado?")){save([]);render()}};
render();
})();
</script>
</body>
</html>
